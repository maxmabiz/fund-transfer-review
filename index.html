    .wrap { display: block; white-space: normal; word-break: break-all; line-height: 1.45; }

    .pager {

  function unlock() {

      row.flowTxn = "";
      row.matchAt = "";
      row.matcher = "";
      row.matcherMail = "";
      row.matchRemark = "";
      row.auditAt = "";
      row.auditor = "";
      row.auditorMail = "";
      row.auditRemark = "";
    }

    function buildFlows() {
      const flows = [];
      ["Airwallex", "Payoneer"].forEach((platform, group) => {
        for (let index = 0; index < 100; index += 1) {
          const serial = group * 100 + index;
          flows.push({
            id: platform.toLowerCase() + "-" + index,
            platform: platform,
            alias: "-",
            txn: (platform === "Airwallex" ? "AW" : "PN") + token(8000 + serial, 12),
            time: stamp(180 + serial * 19),
            currency: index > 0 && index % 23 === 0 ? "EUR" : "USD",
            net: AMOUNTS[index % AMOUNTS.length],
            payer: PAYERS[serial % PAYERS.length],
            account: "demo-" + String(180000 + (mix(serial + 40) % 700000)),
            note: index % 5 === 0 ? "货款" : ""
          });
        }
      });
      return flows;
    }

    const state = {
      rows: buildRows(),
      flows: buildFlows(),
      draft: emptyQuery(),
      applied: emptyQuery(),
      page: 1,
      pageSize: 10,
      dialog: null,
      drawerId: null
    };

    function emptyQuery() {
      return { reviewNo: "", merchantId: "", merchantName: "", uniqueId: "", biz: "", status: "", start: "", end: "", txn: "", precharge: "", prechargeNo: "" };
    }

    function emptyFlowQuery(platform) {
      return { platform: platform, txn: "", currency: "", amount: "", payer: "", account: "", note: "" };
    }

    function listRows() {
      const query = state.applied;
      return state.rows.filter((row) => {
        if (query.reviewNo && row.reviewNo.indexOf(query.reviewNo.trim()) < 0) return false;
        if (query.merchantId && row.merchantId.indexOf(query.merchantId.trim()) < 0) return false;
        if (query.merchantName && row.merchantName.indexOf(query.merchantName.trim()) < 0) return false;
        if (query.uniqueId && row.uniqueId.toLowerCase().indexOf(query.uniqueId.trim().toLowerCase()) < 0) return false;
        if (query.biz && row.biz !== query.biz) return false;
        if (query.status && row.status !== query.status) return false;
        if (query.txn) {
          const key = query.txn.trim().toLowerCase();
          const bizHit = row.bizTxn.toLowerCase().indexOf(key) >= 0;
          const flowHit = row.flowTxn && row.flowTxn.toLowerCase().indexOf(key) >= 0;
          if (!bizHit && !flowHit) return false;
        }
        if (query.precharge && row.precharge !== query.precharge) return false;
        if (query.prechargeNo && row.prechargeNo.toLowerCase().indexOf(query.prechargeNo.trim().toLowerCase()) < 0) return false;
        const day = row.submitAt.slice(0, 10);
        if (query.start && day < query.start) return false;
        if (query.end && day > query.end) return false;
        return true;
      });
    }

    function filteredFlows() {
      const query = state.dialog.applied;
      return state.flows.filter((flow) => {
        if (query.platform && flow.platform !== query.platform) return false;
        if (query.txn && flow.txn.toLowerCase().indexOf(query.txn.trim().toLowerCase()) < 0) return false;
        if (query.currency && flow.currency !== query.currency) return false;
        if (query.amount.trim()) {
          const amount = Number(query.amount);
          if (!Number.isFinite(amount) || Math.round(flow.net * 100) !== Math.round(amount * 100)) return false;
        }
        if (query.payer && flow.payer.indexOf(query.payer.trim()) < 0) return false;
        if (query.account && flow.account.indexOf(query.account.trim()) < 0) return false;
        if (query.note && flow.note.indexOf(query.note.trim()) < 0) return false;
        return true;
      });
    }

    function pageWindow(page, pages) {
      const width = 5;
      let start = Math.max(1, page - 2);
      let end = Math.min(pages, start + width - 1);
      start = Math.max(1, end - width + 1);
      const list = [];
      for (let i = start; i <= end; i += 1) list.push(i);
      return list;
    }

    function pagerHtml(total, page, pages, pageSize, key, sizeId) {
      const item = (label, target, disabled, cls) =>
        '<button type="button" class="page-btn' + (cls ? " " + cls : "") + '" data-' + key + '="' + target + '"' + (disabled ? " disabled" : "") + ">" + label + "</button>";
      const nums = pageWindow(page, pages).map((num) => item(String(num), num, false, num === page ? "on" : "")).join("");
      const sizes = [10, 20, 50].map((size) => '<option value="' + size + '"' + (size === pageSize ? " selected" : "") + ">" + size + "条/页</option>").join("");
      return '<div class="pager-left"><span>共 ' + total + ' 条记录</span><select id="' + sizeId + '" aria-label="每页条数">' + sizes + "</select></div>" +
        '<div class="pager-pages">' +
        item("|&lt;", 1, page <= 1, "text") +
        item("&lt;&lt;", Math.max(1, page - 5), page <= 1, "text") +
        item("&lt;", Math.max(1, page - 1), page <= 1, "text") +
        nums +
        item("&gt;", Math.min(pages, page + 1), page >= pages, "text") +
        item("&gt;&gt;", Math.min(pages, page + 5), page >= pages, "text") +
        item("&gt;|", pages, page >= pages, "text") +
        "</div>";
    }

    function rowHtml(row) {

      return "<tr>" +
        "<td>" + showText(row.reviewNo) + "</td>" +
        "<td>" + esc(row.merchantId) + "</td>" +
        "<td>" + showText(row.merchantName) + "</td>" +
        "<td>" + showText(row.uniqueId) + "</td>" +

        "<td class=\"time\">" + (row.transferDate === "-" ? '<span class="dash">-</span>' : esc(row.transferDate)) + "</td>" +
        "<td>" + showText(row.payer) + "</td>" +

        '<button type="button" class="link" data-act="precharge-form" data-id="' + row.id + '"' + (canPrecharge ? "" : " disabled") + '>预充</button>' +
        '<button type="button" class="link" data-act="reject" data-id="' + row.id + '"' + (canReject ? "" : " disabled") + '>退回并作废</button>' +
        "</div></td></tr>";
    }

      return esc(value);
    }

        field("转账审核单号", '<input class="control" data-q="reviewNo" placeholder="请输入转账审核单号" aria-label="转账审核单号">') +
        field("预充申请", '<select class="control" data-q="precharge" aria-label="预充申请"><option value="">全部</option><option value="是">是</option><option value="否">否</option></select>') +

        '<div class="table-wrap"><table class="list"><thead><tr>' +

      return '<h3 class="section-title first">客户上传的转账信息</h3><div class="info">' +

    }

    function flowTable() {
      const all = filteredFlows();
      const pages = Math.max(1, Math.ceil(all.length / state.dialog.flowPageSize));
      if (state.dialog.flowPage > pages) state.dialog.flowPage = pages;
      const start = (state.dialog.flowPage - 1) * state.dialog.flowPageSize;
      const slice = all.slice(start, start + state.dialog.flowPageSize);
      const body = slice.length ? slice.map((flow) => {

        return '<tr class="' + (picked ? "picked" : "") + '" data-flow-row="' + esc(flow.id) + '">' +

    function moneyLabel(currency, value) {
      const parts = Number(value).toFixed(2).split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return currency + " " + parts.join(".");
    }

    function plusSeconds(value, seconds) {
      const parts = value.split(" ");
      const clock = parts[1].split(":").map(Number);
      const total = clock[0] * 3600 + clock[1] * 60 + clock[2] + seconds;
      return parts[0] + " " + pad(Math.floor(total / 3600) % 24) + ":" + pad(Math.floor(total / 60) % 60) + ":" + pad(total % 60);
    }

    function drawerFigures(row) {
      const index = Number(row.id.slice(2)) - 1;
      const transfer = row.amount == null ? AMOUNTS[index % AMOUNTS.length] : row.amount;
      let pre = Math.round(Math.max(transfer * 0.08, 0.5) * 100) / 100;
      let total = Math.round((1200 + (mix(index + 90) % 9000) + (mix(index + 91) % 100) / 100) * 100) / 100;
      let unpaid = Math.round(total * (30 + (mix(index + 92) % 40)) / 100 * 100) / 100;
      if (unpaid >= total) unpaid = Math.round(total * 0.4 * 100) / 100;
      return { transfer: transfer, pre: pre, total: total, unpaid: unpaid };
    }

    function drawerHtml(row) {
      const figures = drawerFigures(row);
      const group = { "履约": "履约结算组", "广告": "广告结算组", "物流": "物流结算组" }[row.biz] || "结算组";
      const approvalNo = row.submitAt.replace(/\D/g, "").slice(0, 12);
      const later = plusSeconds(row.submitAt, 2);
      return '<div class="drawer-mask" id="drawer-mask"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="pre-title">' +
        '<div class="drawer-hd"><h2 id="pre-title">预充详情</h2><button type="button" class="icon-btn" data-act="close-drawer" aria-label="关闭">' + ICONS.close + "</button></div>" +
        '<div class="drawer-top"><div class="chips"><span class="chip">' + esc(row.biz) + '</span><span class="chip">等待审批</span></div><span class="drawer-no">' + esc(row.prechargeNo) + "</span></div>" +
        '<div class="drawer-bd">' +
        '<section class="block"><h3>单据信息</h3><div class="detail-grid">' +
        '<div class="pair"><span>预充申请单号</span>' + esc(row.prechargeNo) + "</div>" +
        '<div class="pair"><span>交易ID</span>' + esc(row.bizTxn) + "</div>" +
        '<div class="pair"><span>商户ID</span>' + esc(row.merchantId) + "</div>" +
        '<div class="pair"><span>子业务</span>' + esc(row.biz) + "</div></div></section>" +
        '<section class="block"><h3>商户预充汇总</h3><div class="sum-grid">' +
        '<div class="sum-card"><span>预充金额累计</span><b>' + esc(moneyLabel(row.currency, figures.total)) + "</b></div>" +
        '<div class="sum-card"><span>预充金额未还累计</span><b class="warn">' + esc(moneyLabel(row.currency, figures.unpaid)) + "</b></div></div></section>" +
        '<section class="block"><h3>本单金额</h3><div class="detail-grid">' +
        '<div class="pair"><span>转账金额</span>' + esc(moneyLabel(row.currency, figures.transfer)) + "</div>" +
        '<div class="pair"><span>预充金额</span>' + esc(moneyLabel(row.currency, figures.pre)) + "</div></div></section>" +
        '<section class="block"><h3>审批信息</h3><div class="detail-grid">' +
        '<div class="pair"><span>运营部业务组</span>' + esc(group) + "</div><div></div>" +
        '<div class="pair"><span>需要审批</span>是</div>' +
        '<div class="pair"><span>审批单号</span>' + esc(approvalNo) + "</div>" +
        '<div class="pair"><span>审批状态</span><i class="chip fill">等待审批</i></div>' +
        '<div class="pair"><span>预充状态</span><i class="chip fill">审批中</i></div></div></section>' +
        '<section class="block"><h3>进度</h3><ol class="steps">' +
        '<li><i class="dot"></i><div>提交预充申请</div><div class="when">' + esc(row.submitAt) + " · " + esc(row.submitter) + "(" + esc(row.submitterMail) + ")</div></li>" +
        '<li><i class="dot"></i><div>已发起飞书审批</div><div class="when">' + esc(later) + " · 等待财务处理</div></li></ol></section>" +
        '<section class="block"><h3>备注</h3><div>演示备注，待财务核对</div></section>' +
        "</div></aside></div>";
    }

    function renderDrawer() {
      const root = document.getElementById("drawer");
      if (!state.drawerId) {
        root.innerHTML = "";
        return;
      }
      const row = state.rows.find((item) => item.id === state.drawerId);
      root.innerHTML = row && row.prechargeNo ? drawerHtml(row) : "";
    }

    function openDrawer(row) {
      state.drawerId = row.id;
      renderDrawer();
    }

    function closeDrawer() {
      state.drawerId = null;
      renderDrawer();
    }

    function renderOverlay() {
      const root = document.getElementById("overlay");
      if (!state.dialog) {
        root.innerHTML = "";
        return;
      }
      if (state.dialog.kind === "shots") root.innerHTML = shotsHtml();
      else if (state.dialog.kind === "precharge") root.innerHTML = prechargeHtml();
      else if (state.dialog.kind === "invalidate") root.innerHTML = invalidateHtml();
      else if (state.dialog.kind === "revoke") root.innerHTML = revokeHtml();
      else if (state.dialog.kind === "create") root.innerHTML = createHtml();
      else root.innerHTML = matchHtml();
      bindCreateZone();
    }

    function emptyCreate() {
      return {
        biz: "", customer: "", currency: "", platform: "", txn: "", date: "",
        payer: "", amount: "", split: false, ratios: {}, note: "", files: [], errors: {}
      };
    }

    function openCreate() {
      state.dialog = { kind: "create", form: emptyCreate() };
      renderOverlay();
    }

    function syncCreate() {
      if (!state.dialog || state.dialog.kind !== "create") return;
      const form = state.dialog.form;
      ["txn", "date", "payer", "amount", "note"].forEach((key) => {
        const el = document.getElementById("create-" + key);
        if (el) form[key] = el.value;
      });
      document.querySelectorAll("[data-ratio]").forEach((el) => {
        form.ratios[el.dataset.ratio] = el.value;
      });
    }

    function createCustomer() {
      const form = state.dialog.form;
      return CUSTOMERS.find((item) => item.id === form.customer && item.biz === form.biz);
    }

    function customerAccounts(customer) {
      if (!customer) return [];
      const order = ["履约", "广告", "拒付"];
      return CUSTOMERS.filter((item) => item.id === customer.id).sort((a, b) => order.indexOf(a.biz) - order.indexOf(b.biz));
    }

    function canSplit(customer) {
      return customerAccounts(customer).length > 1;
    }

    function parseRatio(raw) {
      const text = String(raw || "").trim();
      if (!/^\d+(\.\d{1,2})?$/.test(text)) return null;
      const value = Math.round(Number(text) * 100) / 100;
      if (value < 0 || value > 100) return null;
      return value;
    }

    function formatRatio(value) {
      return String(Math.round(value * 100) / 100);
    }

    function ratioTotal(accounts, ratios) {
      let sum = 0;
      let complete = true;
      accounts.forEach((item) => {
        const value = parseRatio(ratios[item.biz]);
        if (value == null) complete = false;
        else sum += value;
      });
      return { sum: Math.round(sum * 100) / 100, complete: complete };
    }

    function ratioWarn(total) {
      if (total.sum > 100) return "已超过 100%";
      if (total.complete && total.sum !== 100) return "总和须为 100%";
      return "";
    }

    function exampleBase(amountText, currency) {
      const raw = String(amountText || "").trim();
      const typed = /^\d+(\.\d{1,2})?$/.test(raw) && Number(raw) > 0;
      return { amount: typed ? Number(raw) : 100, sample: !typed, currency: currency || "" };
    }

    function exampleParts(accounts, ratios, amountText, currency) {
      const base = exampleBase(amountText, currency);
      const unit = base.currency ? " " + base.currency : "";
      const title = (base.sample ? "按入账 " : "按转账金额 ") + money(base.amount) + unit + (base.sample ? " 举例" : " 计算");
      const lines = accounts.map((item) => {
        const ratio = parseRatio(ratios[item.biz]);
        if (ratio == null) return "<span><b>" + esc(item.biz) + "</b> —</span>";
        const share = Math.round(base.amount * ratio) / 100;
        return "<span><b>" + esc(item.biz) + "</b> " + esc(formatRatio(ratio) + "%") + " → " + esc(money(share) + unit) + "</span>";
      }).join("");
      return { title: title, lines: lines };
    }

    function paintExample() {
      const title = document.getElementById("ratio-sample-title");
      const list = document.getElementById("ratio-sample-list");
      if (!title || !list || !state.dialog || state.dialog.kind !== "create") return;
      const form = state.dialog.form;
      const amountInput = document.getElementById("create-amount");
      const currencyInput = document.getElementById("create-currency");
      if (amountInput) form.amount = amountInput.value;
      if (currencyInput) form.currency = currencyInput.value;
      const parts = exampleParts(customerAccounts(createCustomer()), form.ratios, form.amount, form.currency);
      title.textContent = parts.title;
      list.innerHTML = parts.lines;
    }

    function addCreateFiles(list) {
      syncCreate();
      const form = state.dialog.form;
      const next = form.files.slice();
      Array.from(list || []).forEach((file) => {
        const pdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
        const image = file.type.indexOf("image/") === 0;
        if (!pdf && !image) {
          showToast("仅支持图片或 PDF");
          return;
        }
        if (file.size > 20 * 1024 * 1024) {
          showToast("单个文件不能超过 20M");
          return;
        }
        if (next.length >= 10) {
          showToast("最多上传 10 个文件");
          return;
        }
        next.push({ name: file.name, size: file.size });
      });
      form.files = next;
      if (next.length && form.errors.files) delete form.errors.files;
      renderOverlay();
    }

    function bindCreateZone() {
      const zone = document.getElementById("upload-zone");
      if (!zone) return;
      zone.addEventListener("dragover", (event) => {
        event.preventDefault();
        zone.classList.add("over");
      });
      zone.addEventListener("dragleave", () => zone.classList.remove("over"));
      zone.addEventListener("drop", (event) => {
        event.preventDefault();
        zone.classList.remove("over");
        if (event.dataTransfer) addCreateFiles(event.dataTransfer.files);
      });
    }

    function takeUploadFiles(list) {
      const incoming = [];
      Array.from(list || []).forEach((file) => {
        const pdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
        const image = file.type.indexOf("image/") === 0;
        if (!pdf && !image) {
          showToast("仅支持图片或 PDF");
          return;
        }
        if (file.size > 20 * 1024 * 1024) {
          showToast("单个文件不能超过 20M");
          return;
        }
        incoming.push({ name: file.name, size: file.size });
      });
      return incoming;
    }

    function addMatchFiles(list) {
      if (!state.dialog || state.dialog.kind !== "match") return;
      syncDialogFields();
      const next = state.dialog.extraFiles.slice();
      takeUploadFiles(list).forEach((file) => {
        if (next.length >= 10) {
          showToast("最多上传 10 个文件");
          return;
        }
        next.push(file);
      });
      state.dialog.extraFiles = next;
      renderOverlay();
    }

    function addPrechargeFiles(list) {
      if (!state.dialog || state.dialog.kind !== "precharge") return;
      const next = (state.dialog.extraFiles || []).slice();
      takeUploadFiles(list).forEach((file) => {
        if (next.length >= 10) {
          showToast("最多上传 10 个文件");
          return;
        }
        next.push(file);
      });
      state.dialog.extraFiles = next;
      renderOverlay();
    }

    function validateCreate() {
      syncCreate();
      const form = state.dialog.form;
      const errors = {};
      if (!form.biz) errors.biz = "请选择子业务";
      if (!form.customer) errors.customer = "请输入客户";
      if (!form.currency) errors.currency = "请选择转账币种";
      if (!form.platform) errors.platform = "请选择支付平台";
      if (!form.txn.trim()) errors.txn = "请输入转账交易ID";
      if (form.amount.trim() && !Number.isFinite(Number(form.amount))) errors.amount = "请输入转账金额";
      const accounts = customerAccounts(createCustomer());
      if (form.split && accounts.length > 1) {
        accounts.forEach((item) => {
          if (parseRatio(form.ratios[item.biz]) == null) errors["ratio-" + item.biz] = "请输入" + item.biz + "分配比例";
        });
        const warn = ratioWarn(ratioTotal(accounts, form.ratios));
        if (warn) errors.ratioSum = warn;
      }
      if (!form.files.length) errors.files = "请上传文件";
      form.errors = errors;
      return !Object.keys(errors).length;
    }

    function submitCreate() {
      if (!validateCreate()) {
        renderOverlay();
        return;
      }
      const form = state.dialog.form;
      const customer = createCustomer();
      const accounts = customerAccounts(customer);
      const amount = form.amount.trim() === "" ? null : Number(form.amount);
      const assign = form.split && accounts.length > 1
        ? accounts.map((item) => item.biz + " " + formatRatio(parseRatio(form.ratios[item.biz])) + "%").join(" / ")
        : "-";
      const index = 200 + state.rows.length;
      const when = stamp(0);
      state.rows.unshift({
        id: "new" + index,
        reviewNo: reviewNo(index),
        merchantId: customer.id,
        merchantName: customer.name,
        merchantUuid: uuid(9000 + index),
        uniqueId: customer.mail,
        biz: form.biz,
        submitAt: when,
        submitter: "林知衡",
        submitterMail: "lin.zhiheng@harbor-demo.test",
        platform: form.platform,
        bizTxn: form.txn.trim(),
        transferDate: form.date || "-",
        payer: form.payer.trim() || "-",
        currency: form.currency,
        amount: amount,
        voucher: form.files[0].name,
        shots: form.files.map((file) => file.name),
        assign: assign,
        confirmStatus: "已确认",
        status: "待匹配",
        allocated: form.split && accounts.length > 1,
        internalNote: form.note.trim(),
        precharge: "否",
        prechargeNo: "",
        flowId: ""
      });
      attachSettlement(state.rows[0], index);
      state.page = 1;
      showToast("已提交线下转账（演示）");
      closeDialog();
      renderRows();
    }

    function splitHtml(customer) {
      if (!canSplit(customer)) return "";
      const form = state.dialog.form;
      const accounts = customerAccounts(customer);
      const total = ratioTotal(accounts, form.ratios);
      const warn = ratioWarn(total);
      const sumClass = total.complete && total.sum === 100 ? " ok" : (warn ? " bad" : "");
      const sumText = "合计 " + formatRatio(total.sum) + "%";
      const lines = form.split ? accounts.map((item) => {
        const key = "ratio-" + item.biz;
        const value = form.ratios[item.biz] || "";
        return '<div class="ratio-item"><b>' + esc(item.biz) + '</b><div class="ratio-field' + (form.errors[key] ? " bad" : "") + '"><input data-ratio="' + esc(item.biz) + '" inputmode="decimal" placeholder="请输入比例" aria-label="' + esc(item.biz) + '分配比例" value="' + esc(value) + '"><span>%</span></div>' +
          (form.errors[key] ? '<p class="err">' + esc(form.errors[key]) + "</p>" : "") + "</div>";
      }).join("") : "";
      const sample = exampleParts(accounts, form.ratios, form.amount, form.currency);
      const ratios = form.split
        ? '<p class="ratio-block-note">使用按比例划拨后，无法使用预充功能。</p>' +
          '<div class="split-hd"><div class="form-label"><i class="req">*</i>分配比例</div><p class="ratio-sum' + sumClass + '" id="ratio-sum">' + esc(sumText) + "</p></div>" +
          '<div class="ratio-board" style="grid-template-columns: repeat(' + accounts.length + ', minmax(0, 1fr))">' + lines + "</div>" +
          '<p class="err" id="ratio-error"' + (warn ? "" : " hidden") + ">" + esc(warn) + "</p>" +
          '<p class="ratio-hint">匹配成功后，入账金额将按业务线分配比例进行分配，总和100%，</p>' +
          '<div class="ratio-sample"><p class="ratio-sample-title" id="ratio-sample-title">' + esc(sample.title) + '</p><div class="ratio-sample-list" id="ratio-sample-list">' + sample.lines + "</div></div>"
        : "";
      return '<div class="span2 split-block"><div class="switch-row"><span>开启按比例划拨</span><button type="button" class="switch' + (form.split ? " on" : "") + '" data-act="toggle-split" role="switch" aria-checked="' + (form.split ? "true" : "false") + '"><i></i></button><span>' + (form.split ? "开启" : "关闭") + "</span></div>" + ratios + "</div>";
    }

      const errors = form.errors;

        const label = item.biz + "：" + item.name + "（" + item.mail + "）";

        '<div><div class="form-label"><i class="req">*</i>子业务</div><div class="radios">' + radio("广告") + radio("履约") + radio("拒付") + "</div>" + err("biz") + "</div>" +

        (customer ? '<div class="cust span2"><div><em>商户ID</em>' + esc(customer.id) + "</div><div><em>ERP代码</em>" + esc(customer.erp) + "</div><div><em>业务经理</em>" + esc(customer.manager) + "</div><div><em>业务员</em>" + esc(customer.staff) + "</div></div>" : "") +

        splitHtml(customer) +

      state.dialog = { kind: "invalidate", rowId: row.id, remark: "" };
      renderOverlay();
    }

    function prechargeQuota(row) {
      const index = Number(row.id.slice(2)) - 1;
      const cap = Math.round((800 + (mix(index + 40) % 9000)) * 100) / 100;
      const used = Math.round(cap * (mix(index + 41) % 50) / 100 * 100) / 100;
      return { currency: row.currency || "USD", cap: cap, used: used, left: Math.round((cap - used) * 100) / 100 };
    }

    function tomorrowValue() {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + 1);
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return date.getFullYear() + "-" + month + "-" + day;
    }

    function submitPrecharge() {
      const dialog = state.dialog;
      const row = currentRow();
      const fulfill = row.biz === "履约";
      const amountInput = document.getElementById("precharge-amount");
      const remarkInput = document.getElementById("precharge-remark");
      const arriveInput = document.getElementById("precharge-arrive");
      const groupInput = document.getElementById("precharge-group");
      dialog.amount = amountInput ? amountInput.value : "";
      dialog.remark = remarkInput ? remarkInput.value : "";
      dialog.arrive = arriveInput ? arriveInput.value : "";
      if (groupInput) {
        dialog.groupQuery = groupInput.value;
        dialog.group = OPS_GROUPS.indexOf(groupInput.value) >= 0 ? groupInput.value : "";
      }
      const amount = dialog.amount.trim();
      const remark = dialog.remark.trim();
      const errors = {};
      if (fulfill && !dialog.group) errors.group = "请选择运营部业务组";
      if (!amount || !/^\d+(\.\d{1,2})?$/.test(amount) || Number(amount) <= 0) errors.amount = "请输入预充金额";
      else if (fulfill && row.amount != null && Number(amount) > Number(row.amount)) errors.amount = "预充金额不可大于转账金额";
      if (!remark) errors.remark = fulfill ? "请填写预充申请事由" : "请输入备注信息";
      if (!dialog.arrive) errors.arrive = "请选择预计到账时间";
      else if (dialog.arrive < tomorrowValue()) errors.arrive = "预计到账时间只能选择今日之后的日期";
      if (!dialog.viewed) errors.file = "请先查看预览一次文件，尽量确保客户已经转账。";
      dialog.errors = errors;
      if (errors.group || errors.amount || errors.arrive || errors.remark || errors.file) {
        renderOverlay();
        return;
      }
      const index = Number(row.id.slice(2)) - 1;
      row.precharge = "是";
      row.prechargeCurrency = row.currency;
      row.prechargeAmount = Number(amount);
      row.expectedAt = dialog.arrive;
      if (!row.prechargeNo) {
        const tail = String(mix(index + 81) % 100).padStart(2, "0");
        row.prechargeNo = "PF" + row.submitAt.replace(/\D/g, "").slice(0, 14) + tail;
      }
      if (dialog.extraFiles && dialog.extraFiles.length) {
        row.shots = rowShots(row).concat(dialog.extraFiles.map((file) => file.name));
      }
      if (fulfill) row.opsGroup = dialog.group;
      showToast(fulfill ? "已提交审批（演示）" : "已提交预充（演示）");
      closeDialog();
      renderRows();
    }

    function applyList() {
      readListDraft();
      state.applied = Object.assign({}, state.draft);
      state.page = 1;
      renderRows();
    }

    function resetList() {
      state.draft = emptyQuery();
      state.applied = emptyQuery();
      state.page = 1;
      document.querySelectorAll("[data-q]").forEach((el) => {
        el.value = "";
        if (el.tagName === "SELECT" && el.dataset.q !== "precharge") el.classList.add("is-placeholder");
      });
      document.getElementById("start").value = "";
      document.getElementById("end").value = "";
      setDateLabel("start", "");
      setDateLabel("end", "");
      renderRows();
    }

    function applyFlowFilter() {
      syncDialogFields();
      state.dialog.applied = Object.assign({}, state.dialog.draft);
      state.dialog.flowPage = 1;
      state.dialog.selectedId = "";
      state.dialog.errors = {};
      renderOverlay();
    }

    function validateDialog() {
      const dialog = state.dialog;
      const errors = {};
      if (!dialog.selectedId) errors.flow = "请选择一条收款交易";
      if (!dialog.remark.trim()) errors.remark = "请填写备注信息";
      dialog.errors = errors;
      return !errors.flow && !errors.remark;
    }

    function submitDialog() {
      syncDialogFields();
      if (!validateDialog()) {
        renderOverlay();
        const target = document.getElementById(state.dialog.errors.remark ? "remark" : "flow-anchor");
        if (target) target.scrollIntoView({ block: "nearest" });
        return;
      }
      const row = currentRow();
      const flow = state.flows.find((item) => item.id === state.dialog.selectedId);
      row.flowId = state.dialog.selectedId;
      row.status = "已匹配";
      if (flow) {
        row.creditCurrency = flow.currency;
        row.creditAmount = flow.net;
        row.payPlatform = flow.platform;
        row.flowTxn = flow.txn;
      }
      row.matchAt = stamp(0);
      row.matcher = CURRENT_USER[0];
      row.matcherMail = CURRENT_USER[1];
      row.matchRemark = state.dialog.remark.trim();
      row.extraFiles = state.dialog.extraFiles.map((file) => ({ name: file.name, size: file.size }));
      row.auditAt = "";
      row.auditor = "";
      row.auditorMail = "";
      row.auditRemark = "";
      showToast("已匹配（演示）");
      closeDialog();
      renderRows();
    }

    let toastTimer = 0;
    function showToast(message) {
      const el = document.getElementById("toast");
      el.innerHTML = '<span class="toast-dot"></span><span>' + esc(message) + "</span>";
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function pickFlow(id) {
      state.dialog.selectedId = state.dialog.selectedId === id ? "" : id;
      document.querySelectorAll("[data-flow]").forEach((el) => {
        const on = el.dataset.flow === state.dialog.selectedId;
        el.checked = on;
        el.closest("tr").classList.toggle("picked", on);
      });
      const error = document.getElementById("flow-error");
      if (error && state.dialog.selectedId) error.remove();
    }

    function onAction(act, button) {
      if (act === "search") return applyList();
      if (act === "reset") return resetList();
      if (act === "create") return openCreate();
      if (act === "create-ok") return submitCreate();
      if (act === "toggle-split" && state.dialog && state.dialog.kind === "create") {
        syncCreate();
        const body = document.querySelector(".dialog.create .dialog-bd");
        const top = body ? body.scrollTop : 0;
        state.dialog.form.split = !state.dialog.form.split;
        renderOverlay();
        const next = document.querySelector(".dialog.create .dialog-bd");
        if (next) next.scrollTop = top;
        return;
      }
      if (act === "remove-file" && state.dialog && state.dialog.kind === "create") {
        syncCreate();
        state.dialog.form.files.splice(Number(button.dataset.index), 1);
        renderOverlay();
        return;
      }
      if (act === "export") return showToast("演示页不导出敏感字段");
      if (act === "palette") return showToast("演示页未开放全局搜索");
      if (act === "bell") return showToast("没有新通知");
      if (act === "theme") return showToast("演示页保持浅色");
      if (act === "account") return showToast("当前操作人：" + CURRENT_USER[0] + "（" + CURRENT_ROLE + "）");
      if (act === "pick") {
        const input = document.getElementById(button.dataset.which);
        if (input && typeof input.showPicker === "function") {
          try { input.showPicker(); return; } catch (err) { /* 未聚焦时部分浏览器会拒绝 */ }
        }
        if (input) input.focus();
        return;
      }
      const row = state.rows.find((item) => item.id === button.dataset.id);
      if (act === "precharge-open" && row) return openDrawer(row);
      if (act === "precharge-form" && row && row.status === "已匹配" && !row.allocated) return openPrecharge(row);
      if (act === "precharge-ok") return submitPrecharge();
      if (act === "guide-toggle" && state.dialog && state.dialog.kind === "precharge") return setGuide(!state.dialog.guideOpen);
      if (act === "guide-open" && state.dialog && state.dialog.kind === "precharge") return setGuide(true);
      if (act === "legend" && state.dialog && state.dialog.kind === "precharge") return openLegend(button.dataset.kind);
      if (act === "close-legend") return closeLegend();
      if (act === "group-pick" && state.dialog && state.dialog.kind === "precharge") {
        state.dialog.group = button.dataset.name;
        state.dialog.groupQuery = button.dataset.name;
        state.dialog.groupOpen = false;
        const input = document.getElementById("precharge-group");
        if (input) {
          input.value = button.dataset.name;
          input.classList.remove("bad");
        }
        const menu = document.getElementById("group-menu");
        if (menu) menu.hidden = true;
        const error = document.querySelector(".group-search + .err");
        if (error) error.remove();
        return;
      }
      if (act === "close-drawer") return closeDrawer();
      if (act === "match" && row) return openMatch(row);
      if (act === "reject" && row && row.status === "已匹配" && isFinance()) return openInvalidate(row);
      if (act === "void-ok") return submitVoid();
      if (act === "revoke" && row) return openRevoke(row);
      if (act === "revoke-ask") return askRevokeConfirm();
      if (act === "revoke-back" && state.dialog && state.dialog.kind === "revoke") {
        state.dialog.confirm = false;
        renderOverlay();
        return;
      }
      if (act === "revoke-ok") return submitRevoke();
      if (act === "close") return closeDialog();
      if (act === "flow-search") return applyFlowFilter();
      if (act === "ok") return submitDialog();
      if (act === "shot" && row) return openShots(row);
      if (act === "shot-preview" && state.dialog && state.dialog.kind === "shots") {
        const files = rowShots(currentRow());
        state.shotName = "";
        state.dialog.previewName = files[Number(button.dataset.index)] || "";
        return openPdf();
      }
      if (act === "precharge-add" && state.dialog && state.dialog.kind === "precharge") {
        const input = document.getElementById("precharge-files");
        if (input) input.click();
        return;
      }
      if (act === "precharge-preview" && state.dialog && state.dialog.kind === "precharge") {
        const file = state.dialog.extraFiles[Number(button.dataset.index)];
        state.shotName = "";
        state.dialog.previewName = file ? file.name : "";
        return openPdf();
      }
      if (act === "precharge-remove" && state.dialog && state.dialog.kind === "precharge") {
        state.dialog.extraFiles.splice(Number(button.dataset.index), 1);
        renderOverlay();
        return;
      }
      if (act === "preview-file") {
        state.shotName = "";
        if (state.dialog && state.dialog.kind === "precharge") state.dialog.viewed = true;
        if (state.dialog) state.dialog.previewName = "";
        return openPdf();
      }
      if (act === "match-add" && state.dialog && state.dialog.kind === "match") {
        const input = document.getElementById("match-files");
        if (input) input.click();
        return;
      }
      if (act === "match-preview" && state.dialog && state.dialog.kind === "match") {
        state.shotName = "";
        const file = state.dialog.extraFiles[Number(button.dataset.index)];
        state.dialog.previewName = file ? file.name : "";
        return openPdf();
      }
      if (act === "match-remove" && state.dialog && state.dialog.kind === "match") {
        syncDialogFields();
        state.dialog.extraFiles.splice(Number(button.dataset.index), 1);
        renderOverlay();
        return;
      }
      if (act === "close-pdf") return closePdf();
    }

    document.getElementById("app").innerHTML = shell();
    renderRows();

    document.addEventListener("click", (event) => {
      if (event.target.id === "legend-mask") return closeLegend();
      if (event.target.id === "pdf-mask") return closePdf();
      if (event.target.id === "drawer-mask") return closeDrawer();
      if (event.target.id === "revoke-confirm-mask" && state.dialog) {
        state.dialog.confirm = false;
        renderOverlay();
        return;
      }
      if (event.target.id === "mask") return closeDialog();
      const flowRow = event.target.closest("tr[data-flow-row]");
      if (flowRow && event.target.tagName !== "INPUT") return pickFlow(flowRow.dataset.flowRow);
      const flowPage = event.target.closest("[data-fpage]");
      if (flowPage && !flowPage.disabled && state.dialog) {
        syncDialogFields();
        state.dialog.flowPage = Number(flowPage.dataset.fpage);
        renderOverlay();
        return;
      }
      const pageBtn = event.target.closest("[data-page]");
      if (pageBtn && !pageBtn.disabled && pageBtn.closest("#pager")) {
        state.page = Number(pageBtn.dataset.page);
        renderRows();
        return;
      }
      if (state.dialog && state.dialog.kind === "precharge" && state.dialog.groupOpen && !event.target.closest(".group-search")) {
        state.dialog.groupOpen = false;
        const menu = document.getElementById("group-menu");
        if (menu) menu.hidden = true;
      }
      const button = event.target.closest("[data-act]");
      if (!button || button.disabled) return;
      onAction(button.dataset.act, button);
    });

    document.addEventListener("change", (event) => {
      const target = event.target;
      if (target.dataset.q) {
        state.draft[target.dataset.q] = target.value;
        if (target.dataset.q !== "precharge") target.classList.toggle("is-placeholder", !target.value);
      }
      if (target.id === "start" || target.id === "end") {
        state.draft[target.id] = target.value;
        setDateLabel(target.id, target.value);
      }
      if (target.id === "page-size") {
        state.pageSize = Number(target.value);
        state.page = 1;
        renderRows();
      }
      if (target.dataset.flow) return pickFlow(target.dataset.flow);
      if (target.name === "create-biz" && state.dialog && state.dialog.kind === "create") {
        syncCreate();
        state.dialog.form.biz = target.value;
        if (!CUSTOMERS.some((item) => item.biz === target.value && item.id === state.dialog.form.customer)) {
          state.dialog.form.customer = "";
          state.dialog.form.split = false;
          state.dialog.form.ratios = {};
        }
        if (state.dialog.form.errors.biz) delete state.dialog.form.errors.biz;
        renderOverlay();
      }
      if ((target.id === "create-customer" || target.id === "create-currency" || target.id === "create-platform") && state.dialog && state.dialog.kind === "create") {
        syncCreate();
        const key = target.id.replace("create-", "");
        state.dialog.form[key] = target.value;
        if (key === "customer" && !canSplit(createCustomer())) {
          state.dialog.form.split = false;
          state.dialog.form.ratios = {};
        }
        target.classList.toggle("is-placeholder", !target.value);
        if (state.dialog.form.errors[key]) delete state.dialog.form.errors[key];
        renderOverlay();
      }
      if (target.id === "precharge-arrive" && state.dialog && state.dialog.kind === "precharge") {
        state.dialog.arrive = target.value;
        const label = document.getElementById("precharge-arrive-label");
        if (label) {
          label.textContent = target.value || "请选择预计到账时间";
          label.classList.toggle("placeholder", !target.value);
        }
      }
      if (target.id === "create-date" && state.dialog && state.dialog.kind === "create") {
        state.dialog.form.date = target.value;
        const label = document.getElementById("create-date-label");
        if (label) {
          label.textContent = target.value || "请选择转账日期";
          label.classList.toggle("placeholder", !target.value);
        }
      }
      if (target.id === "create-files") {
        addCreateFiles(target.files);
        target.value = "";
      }
      if (target.id === "match-files" && state.dialog && state.dialog.kind === "match") {
        addMatchFiles(target.files);
        target.value = "";
      }
      if (target.id === "precharge-files" && state.dialog && state.dialog.kind === "precharge") {
        addPrechargeFiles(target.files);
        target.value = "";
      }
      if (target.id === "flow-size" && state.dialog) {
        syncDialogFields();
        state.dialog.flowPageSize = Number(target.value);
        state.dialog.flowPage = 1;
        renderOverlay();
      }
      if (target.dataset.filter === "currency") target.classList.toggle("is-placeholder", !target.value);
    });

    document.addEventListener("focusin", (event) => {
      if (event.target.id !== "precharge-group" || !state.dialog || state.dialog.kind !== "precharge") return;
      state.dialog.groupOpen = true;
      const menu = document.getElementById("group-menu");
      if (menu) menu.hidden = false;
    });

    document.addEventListener("input", (event) => {
      const target = event.target;
      if (target.dataset.q) state.draft[target.dataset.q] = target.value;
      if (!state.dialog) return;
      if (target.id === "remark") {
        state.dialog.remark = target.value;
        target.classList.remove("bad");
        const error = document.getElementById("remark-error");
        if (error) error.remove();
      }
      if (target.id === "revoke-remark" && state.dialog && state.dialog.kind === "revoke") {
        if (target.value.length > 200) target.value = target.value.slice(0, 200);
        state.dialog.remark = target.value;
        const count = document.getElementById("revoke-count");
        if (count) count.textContent = target.value.length + " / 200";
        if (target.value.trim()) {
          target.classList.remove("bad");
          state.dialog.error = "";
          const error = target.parentElement.parentElement.querySelector(".err");
          if (error) error.remove();
        }
      }
      if (target.id === "precharge-group" && state.dialog && state.dialog.kind === "precharge") {
        state.dialog.groupQuery = target.value;
        state.dialog.group = OPS_GROUPS.indexOf(target.value) >= 0 ? target.value : "";
        state.dialog.groupOpen = true;
        const menu = document.getElementById("group-menu");
        if (menu) {
          const query = target.value.trim();
          const names = OPS_GROUPS.filter((name) => !query || name.indexOf(query) >= 0);
          menu.innerHTML = names.length ? names.map((name) => '<button type="button" class="group-opt" data-act="group-pick" data-name="' + esc(name) + '">' + esc(name) + "</button>").join("") : '<div class="group-empty">无匹配业务组</div>';
          menu.hidden = false;
        }
      }
      if (target.dataset.ratio && state.dialog && state.dialog.kind === "create") {
        state.dialog.form.ratios[target.dataset.ratio] = target.value;
        const item = target.closest(".ratio-item");
        const box = target.closest(".ratio-field");
        if (box) box.classList.remove("bad");
        if (item) {
          const error = item.querySelector(".err");
          if (error) error.remove();
        }
        delete state.dialog.form.errors["ratio-" + target.dataset.ratio];
        const accounts = customerAccounts(createCustomer());
        const total = ratioTotal(accounts, state.dialog.form.ratios);
        const warn = ratioWarn(total);
        if (warn) state.dialog.form.errors.ratioSum = warn;
        else delete state.dialog.form.errors.ratioSum;
        const sumError = document.getElementById("ratio-error");
        if (sumError) {
          sumError.hidden = !warn;
          sumError.textContent = warn;
        }
        const sum = document.getElementById("ratio-sum");
        if (sum) {
          const ready = total.complete && total.sum === 100;
          sum.textContent = "合计 " + formatRatio(total.sum) + "%";
          sum.classList.toggle("ok", ready);
          sum.classList.toggle("bad", !!warn);
        }
        paintExample();
      }
      if (target.id === "create-amount" && state.dialog && state.dialog.kind === "create") {
        state.dialog.form.amount = target.value;
        paintExample();
      }
      if (target.id === "precharge-amount" && state.dialog && state.dialog.kind === "precharge") {
        state.dialog.amount = target.value;
      }
      if (target.id === "precharge-remark" && state.dialog && state.dialog.kind === "precharge") {
        if (target.value.length > 500) target.value = target.value.slice(0, 500);
        state.dialog.remark = target.value;
        const count = document.getElementById("precharge-count");
        if (count) count.textContent = target.value.length + " / 500";
      }
      if (target.id === "void-remark" && state.dialog) {
        if (target.value.length > 1000) target.value = target.value.slice(0, 1000);
        state.dialog.remark = target.value;
        const count = document.getElementById("void-count");
        if (count) count.textContent = target.value.length + " / 1000";
      }
      if (target.id === "create-note" && state.dialog && state.dialog.kind === "create") {
        if (target.value.length > 1000) target.value = target.value.slice(0, 1000);
        state.dialog.form.note = target.value;
        const count = document.getElementById("create-count");
        if (count) count.textContent = target.value.length + " / 1000";
      }
      if (target.dataset.filter) state.dialog.draft[target.dataset.filter] = target.value;
    });

    document.addEventListener("paste", (event) => {
      if (!state.dialog || !event.clipboardData || !event.clipboardData.files || !event.clipboardData.files.length) return;
      if (state.dialog.kind === "create") {
        event.preventDefault();
        addCreateFiles(event.clipboardData.files);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (document.getElementById("legend-mask")) return closeLegend();
        if (document.getElementById("pdf-mask")) return closePdf();
        if (state.dialog && state.dialog.kind === "revoke" && state.dialog.confirm) {
          state.dialog.confirm = false;
          renderOverlay();
          return;
        }
        if (state.drawerId) return closeDrawer();
        if (state.dialog) return closeDialog();
      }
      if (event.key === "Enter" && event.target.dataset && event.target.dataset.q) {
        event.preventDefault();
        applyList();
      }
      if (event.key === "Enter" && event.target.dataset && event.target.dataset.filter) {
        event.preventDefault();
        applyFlowFilter();
      }
    });
  </script>
</body>
</html>
